<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYSXLOVE | Admin Access</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="brand">DAYSXLOVE</h1>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="members.html">Members</a>
                <a href="suggestions.html">Suggestions</a>
                <a href="admin-login.html">Admin Login</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Announcement Admin Access</h2>
            <p>Post announcements to the homepage feed.</p>
        </section>

        <section class="grid">
            <form id="announcementForm" class="card form-card">
                <p class="muted" id="loggedInAs"></p>

                <label for="announcement">Announcement</label>
                <textarea id="announcement" name="announcement" placeholder="Write an update..." required></textarea>

                <input type="submit" value="Post Announcement">
            </form>

            <article class="card">
                <h3>Allowed Admins</h3>
                <ul class="list">
                    <li>JPhanton</li>
                    <li>NXLKeplit</li>
                </ul>
                <p class="muted">Need to switch account? <a href="admin-login.html">Go back to login</a>.</p>
            </article>
        </section>
    </main>

    <footer class="footer">
        <div class="container">DAYSXLOVE official webpage.</div>
    </footer>

    <script>
        const announcementForm = document.getElementById('announcementForm');
        const messageInput = document.getElementById('announcement');
        const loggedInAs = document.getElementById('loggedInAs');

        const adminAliases = {
            'julianatservice@gmail.com': 'JPhanton',
            'dvnpaul28@gmail.com': 'NXLKeplit'
        };

        const isAuthenticated = sessionStorage.getItem('kaxkeAdminAuthenticated') === 'true';
        const sessionAdminEmail = (sessionStorage.getItem('kaxkeAdminEmail') || '').toLowerCase();

        if (!isAuthenticated || !Object.prototype.hasOwnProperty.call(adminAliases, sessionAdminEmail)) {
            window.location.href = 'admin-login.html';
        } else {
            loggedInAs.textContent = 'Logged in as: ' + adminAliases[sessionAdminEmail];
        }

        announcementForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const message = messageInput.value.trim();
            if (!message) {
                return;
            }

            const savedAnnouncements = JSON.parse(localStorage.getItem('kaxkeAnnouncements') || '[]');
            savedAnnouncements.push({
                email: sessionAdminEmail,
                author: adminAliases[sessionAdminEmail],
                message: message
            });
            localStorage.setItem('kaxkeAnnouncements', JSON.stringify(savedAnnouncements));

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
