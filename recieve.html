<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S: No Energy | Admin Access</title>
    <link rel="stylesheet" href="styles.css">
    <script src="Site-Transition.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html" aria-label="S: No Energy home">
                <span class="brand-text">S: No Energy</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="members.html">Members</a>
                <a href="Chats.html">Chats</a>
                <a href="suggestions.html">Suggestions</a>
                <a href="Admin-login.html">Admin Login</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Announcement Admin Access</h2>
            <p>Post announcements and review incoming suggestions.</p>
        </section>

        <section class="grid">
            <form id="announcementForm" class="card form-card">
                <p class="muted" id="loggedInAs"></p>

                <label for="announcementEditor">Announcement</label>
                <div class="editor-toolbar" aria-label="Announcement formatting tools">
                    <button type="button" class="editor-button" data-command="underline"><u>U</u></button>
                </div>
                <div id="announcementEditor" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write an update..."></div>
                <input type="hidden" id="announcement" name="announcement" required>

                <input type="submit" value="Post Announcement">
            </form>

            <article class="card">
                <h3>Suggestions Inbox</h3>
                <p class="muted">Click a suggestion to open it in a popup.</p>
                <div id="suggestionInbox" class="suggestion-inbox"></div>
            </article>
        </section>
    </main>

    <button id="logoutButton" class="logout-button" type="button">Log Out</button>

    <div id="suggestionModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button id="closeModal" class="modal-close" type="button">&times;</button>
            <h3 id="modalTitle">Suggestion</h3>
            <p id="modalBody" class="muted"></p>
            <p id="modalTime" class="muted"></p>
        </div>
    </div>

    <footer class="footer">
        <div class="container">S: No Energy official webpage.</div>
    </footer>

    <script type="module">
        import {
            db,
            onValue,
            orderByChild,
            push,
            query,
            ref,
            set
        } from './firebase-config.js';

        const announcementForm = document.getElementById('announcementForm');
        const messageInput = document.getElementById('announcement');
        const editor = document.getElementById('announcementEditor');
        const loggedInAs = document.getElementById('loggedInAs');
        const suggestionInbox = document.getElementById('suggestionInbox');
        const suggestionModal = document.getElementById('suggestionModal');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalTime = document.getElementById('modalTime');
        const logoutButton = document.getElementById('logoutButton');
        const authStorageKey = 'kaxkeAdminAuthenticated';
        const emailStorageKey = 'kaxkeAdminEmail';

        const adminAliases = {
            'daysxlove@gmail.com': 'SYN4RGY',
            'dxl.x.dyd@gmail.com': 'Dyumdai'
        };

        const isAuthenticated = localStorage.getItem(authStorageKey) === 'true';
        const sessionAdminEmail = (localStorage.getItem(emailStorageKey) || '').toLowerCase();

        if (!isAuthenticated || !Object.prototype.hasOwnProperty.call(adminAliases, sessionAdminEmail)) {
            window.location.href = 'Admin-login.html';
        } else {
            loggedInAs.textContent = 'Logged in as: ' + adminAliases[sessionAdminEmail];
        }

        function sanitizeAnnouncementHtml(html) {
            const container = document.createElement('div');
            container.innerHTML = html;

            function cleanNode(node) {
                Array.from(node.children).forEach(function (child) {
                    const tagName = child.tagName.toLowerCase();
                    const allowedTags = ['u', 'br', 'div', 'p'];

                    if (!allowedTags.includes(tagName)) {
                        child.replaceWith(document.createTextNode(child.textContent || ''));
                        return;
                    }

                    Array.from(child.attributes).forEach(function (attribute) {
                        child.removeAttribute(attribute.name);
                    });

                    cleanNode(child);
                });
            }

            cleanNode(container);
            return container.innerHTML
                .replace(/<(div|p)><br><\/(div|p)>/gi, '<br>')
                .replace(/<\/(div|p)>\s*<(div|p)>/gi, '<br>')
                .replace(/<(div|p)>/gi, '')
                .replace(/<\/(div|p)>/gi, '')
                .trim();
        }

        document.querySelectorAll('.editor-button').forEach(function (button) {
            button.addEventListener('click', function () {
                editor.focus();
                document.execCommand(button.dataset.command, false);
                messageInput.value = sanitizeAnnouncementHtml(editor.innerHTML);
            });
        });

        editor.addEventListener('input', function () {
            messageInput.value = sanitizeAnnouncementHtml(editor.innerHTML);
        });

        function renderSuggestions() {
            suggestionInbox.innerHTML = '<p class="muted">Loading suggestions...</p>';

            try {
                const suggestionsQuery = query(ref(db, 'suggestions'), orderByChild('createdAt'));

                onValue(suggestionsQuery, function (snapshot) {
                    const rawSuggestions = snapshot.val() || {};
                    const savedSuggestions = Object.values(rawSuggestions).sort(function (a, b) {
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    });

                    if (savedSuggestions.length === 0) {
                        suggestionInbox.innerHTML = '<p class="muted">No suggestions yet.</p>';
                        return;
                    }

                    suggestionInbox.innerHTML = savedSuggestions
                        .map(function (item, index) {
                            const safeName = item.name || 'Anonymous';
                            const preview = (item.message || '').slice(0, 70);
                            return '<button class="suggestion-entry" type="button" data-index="' + index + '"><strong>' + safeName + ':</strong> ' + preview + (item.message.length > 70 ? '...' : '') + '</button>';
                        })
                        .join('');

                    suggestionInbox.querySelectorAll('.suggestion-entry').forEach(function (button) {
                        button.addEventListener('click', function () {
                            const item = savedSuggestions[Number(button.dataset.index)];
                            modalTitle.textContent = 'Suggestion from ' + (item.name || 'Anonymous');
                            modalBody.textContent = item.message || '';
                            modalTime.textContent = item.createdAt
                                ? 'Sent: ' + new Date(item.createdAt).toLocaleString()
                                : '';
                            suggestionModal.classList.add('show');
                            suggestionModal.setAttribute('aria-hidden', 'false');
                        });
                    });
                }, function () {
                    suggestionInbox.innerHTML = '<p class="muted">Live suggestions are unavailable right now.</p>';
                });
            } catch (error) {
                suggestionInbox.innerHTML = '<p class="muted">Live suggestions are unavailable right now.</p>';
            }
        }

        closeModal.addEventListener('click', function () {
            suggestionModal.classList.remove('show');
            suggestionModal.setAttribute('aria-hidden', 'true');
        });

        suggestionModal.addEventListener('click', function (event) {
            if (event.target === suggestionModal) {
                suggestionModal.classList.remove('show');
                suggestionModal.setAttribute('aria-hidden', 'true');
            }
        });

        logoutButton.addEventListener('click', function () {
            localStorage.removeItem(authStorageKey);
            localStorage.removeItem(emailStorageKey);
            window.location.href = 'Admin-login.html';
        });

        announcementForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const message = sanitizeAnnouncementHtml(editor.innerHTML);
            const plainText = editor.textContent.trim();

            if (!plainText) {
                return;
            }

            messageInput.value = message;

            try {
                const newAnnouncementRef = push(ref(db, 'announcements'));
                await set(newAnnouncementRef, {
                    email: sessionAdminEmail,
                    author: adminAliases[sessionAdminEmail],
                    message: message,
                    createdAt: Date.now()
                });

                window.location.href = 'index.html';
            } catch (error) {
                alert('Announcement could not be posted right now.');
            }
        });

        renderSuggestions();
    </script>
</body>
</html>
