<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAXKE Webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to KAXKE</h1>
    <h4>Quick links to suggestions, members, and official pages.</h4>

    <div class="main-container">
        <div class="links">
            <a href="suggestions.html">Suggestions</a>
            <a href="members.html">Members</a>
            <a href="recieve.html">Announcement Admin Access</a>
            <a href="https://www.youtube.com/@YourLovelyKeplit">YouTube</a>
            <a href="https://genius.com/KAXKE">Genius</a>
        </div>

        <section class="announcements">
            <h2>Announcements</h2>
            <p class="access-note">This page receives and shows announcements. Posting is limited to approved admins on the Admin Access page.</p>
            <div id="announcementList"></div>
        </section>
    </div>

    <script>
        const announcementList = document.getElementById('announcementList');
        const savedAnnouncements = JSON.parse(localStorage.getItem('kaxkeAnnouncements') || '[]');

        const adminAliases = {
            'julianatservice@gmail.com': 'JPhanton',
            'dvnpaul28@gmail.com': 'NXLKeplit'
        };

        if (savedAnnouncements.length === 0) {
            announcementList.innerHTML = '<p class="announcement-item"><strong>Admin:</strong> Welcome to the KAXKE page.</p>';
        } else {
            announcementList.innerHTML = savedAnnouncements
                .slice()
                .reverse()
                .map(function (item) {
                    const displayName = item.author || adminAliases[item.email] || 'Admin';
                    return '<p class="announcement-item"><strong>' + displayName + ':</strong> ' + item.message + '</p>';
                })
                .join('');
        }
    </script>
</body>
</html>
