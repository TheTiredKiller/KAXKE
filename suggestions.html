<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S: No Energy | Suggestions</title>
    <link rel="stylesheet" href="styles.css">
    <script src="device-mode.js" defer></script>
    <script src="Site-Transition.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app-update.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html" aria-label="S: No Energy home">
                <span class="brand-text">S: No Energy</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="members.html">Members</a>
                <a href="Chats.html">Chats</a>
                <a href="suggestions.html">Suggestions</a>
                <a href="Admin-login.html">Admin Login</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Send a Suggestion</h2>
            <p>Share your ideas to help improve music releases, content, and community updates.</p>
        </section>

        <section class="grid">
            <form id="suggestionForm" class="card form-card">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="suggestion">Suggestion</label>
                <textarea id="suggestion" name="suggestion" placeholder="Write your suggestion" required></textarea>

                <input type="submit" value="Send Suggestion">
            </form>

            <article class="card">
                <h3>What to submit</h3>
                <ul class="list">
                    <li>Music topic requests</li>
                    <li>Video/content ideas</li>
                    <li>Constructive feedback for improvements</li>
                </ul>
            </article>
        </section>
    </main>

    <footer class="footer">
        <div class="container">S: No Energy official webpage.</div>
    </footer>

    <script>
        const suggestionForm = document.getElementById('suggestionForm');
        const db = window.SNOENERGY_DB;

        suggestionForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const nameInput = document.getElementById('name');
            const suggestionInput = document.getElementById('suggestion');
            const name = nameInput.value.trim();
            const message = suggestionInput.value.trim();

            if (!name || !message) {
                return;
            }

            try {
                const newSuggestionRef = db.ref('suggestions').push();
                await newSuggestionRef.set({
                    name: name,
                    message: message,
                    createdAt: Date.now()
                });

                alert('Suggestion sent to the admin inbox.');
                suggestionForm.reset();
            } catch (error) {
                console.error('Suggestion save failed:', error);
                alert('Suggestion could not be sent right now.');
            }
        });
    </script>
</body>
</html>
