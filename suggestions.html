<!DOCTYPE html>
<html>
<head>
    <title>Suggestion Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            padding: 40px;
        }

        form {
            background-color: white;
            display: inline-block;
            padding: 20px 30px;
            border-radius: 12px;
            border: 2px solid black;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 250px;
            padding: 8px;
            border: 2px solid black;
            border-radius: 8px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        input[type="submit"] {
            margin-top: 15px;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background-color: cyan;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>Send Your Suggestion</h1>

    <form action="https://formspree.io/f/xlgwnppn" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="suggestion">Suggestion:</label>
        <textarea id="suggestion" name="suggestion" placeholder="Your suggestion" required></textarea>

        <input type="submit" value="Send">
    </form>

</body>
</html>
