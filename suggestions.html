<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestion Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Send Your Suggestion</h1>

    <form class="card form-card" action="https://formspree.io/f/xlgwnppn" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="suggestion">Suggestion:</label>
        <textarea id="suggestion" name="suggestion" placeholder="Your suggestion" required></textarea>

        <input type="submit" value="Send">
    </form>
</body>
</html>
